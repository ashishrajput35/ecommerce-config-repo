server:
  port: 8080


spring:
  application:
    name: ecommerce-api-gateway
  cloud:
    gateway:
      routes:
        - id: ecommerce-auth-service
          uri: lb://ecommerce-auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: ecommerce-user-service
          uri: lb://ecommerce-user-service
          predicates:
            - Path=/api/v1/user/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# front end origin
frontend:
  origin: http://localhost:5173