server:
  port: 8080


spring:
  application:
    name: ecommerce-api-gateway
  cloud:
    gateway:
      routes:
        - id: ecommerce-auth-service
          uri: lb://ecommerce-auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: ecommerce-user-service
          uri: lb://ecommerce-user-service
          predicates:
            - Path=/api/v1/user/**
      globalcors:
        allowed-origins: "http://localhost:5173"  # Frontend origin
        allowed-methods: "GET, POST, PUT, DELETE"  # Allowed HTTP methods
        allowed-headers: "*"  # Allow all headers
        allow-credentials: true  # Allow credentials (cookies, Authorization headers)

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/