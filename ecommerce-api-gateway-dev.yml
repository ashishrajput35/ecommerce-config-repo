server:
  port: 8080


spring:
  application:
    name: ecommerce-api-gateway
  cloud:
    gateway:
      routes:
        - id: ecommerce-auth-service
          uri: lb://ecommerce-auth-service
          predicates:
            - Path=/api/v1/auth/**

        - id: ecommerce-user-service
          uri: lb://ecommerce-user-service
          predicates:
            - Path=/api/v1/user/**



eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/