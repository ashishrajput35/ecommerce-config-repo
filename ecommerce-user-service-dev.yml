server:
  port: 8082

spring:

  datasource:
    url: jdbc:mysql://localhost:3306/ecommerce_user_db?allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: Root@1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update # You can use 'create', 'validate', or 'none' based on your environment
    shwo-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  jackson:
    serialization:
      fail-on-empty-beans: false
      INDENT_OUTPUT: true



# Swagger/OpenAPI customization
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tryItOutEnabled: true
    operationsSorter: method

# Flyway (optional)
flyway:
  enabled: true
  locations: classpath:db/migration

# Logging level
logging:
  level:
    org.springframework: INFO
    com.raj.userservice: DEBUG